name: Backend CD

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - "tools/mcp-gateway/**"
      - "docker/docker-compose.mcp-gateway.yml"
      - ".github/workflows/mcp-gateway-cd.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/NBE8-10-final-Team04
            git fetch
            git checkout develop
            git pull origin develop
            cd docker
            docker compose down
            docker compose build
            docker compose up -d
