spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  storage:
    type: oci

logging:
  level:
    root: WARN
    back: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30