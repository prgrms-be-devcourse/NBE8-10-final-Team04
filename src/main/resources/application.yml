server:
  forward-headers-strategy: native

spring:
  application:
    name: start-ai-hub
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 5MB

app:
  embedding:
    base-url: ${APP_EMBEDDING_BASE_URL:https://embedding-server-domain}
  mcp:
    recommendation:
      candidate-source: ${APP_MCP_RECOMMENDATION_CANDIDATE_SOURCE:skill-search}
      ranking:
        weight:
          primary: ${APP_MCP_RECOMMENDATION_WEIGHT_PRIMARY:0.60}
          stars: ${APP_MCP_RECOMMENDATION_WEIGHT_STARS:0.20}
          forks: ${APP_MCP_RECOMMENDATION_WEIGHT_FORKS:0.10}
          freshness: ${APP_MCP_RECOMMENDATION_WEIGHT_FRESHNESS:0.10}
        final-score-threshold: ${APP_MCP_RECOMMENDATION_FINAL_SCORE_THRESHOLD:0.45}
  storage:
    type: ${APP_STORAGE_TYPE:oci}
    local:
      upload-dir: ${APP_STORAGE_LOCAL_UPLOAD_DIR:./uploads}
    oci:
      bucket: ${OCI_OBJECT_STORAGE_BUCKET:}
      namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:}
      prefix: ${OCI_OBJECT_STORAGE_PREFIX:data/}
      auth-type: ${OCI_AUTH_TYPE:config-file}
      config-file-path: ${OCI_CONFIG_FILE_PATH:~/.oci/config}
      profile: ${OCI_CONFIG_PROFILE:DEFAULT}
      region: ${OCI_REGION:}
  prompts:
    base-path: ${APP_PROMPTS_BASE_PATH:data/prompts}
    oci-prefix: ${OCI_OBJECT_STORAGE_PROMPTS_PREFIX:data/prompts/}
  ai-info:
    oci-prefix: ${AI_INFO_OCI_PREFIX:data/ai-info/}
  ai-tracker:
    oci-prefix: ${AI_TRACKER_OCI_PREFIX:data/ai-tracker/}
    webhook-secret: ${SPRING_WEBHOOK_SECRET}

  data:
    collect:
      artificial-analysis-key: ${ARTIFICIAL_ANALYSIS_API_KEY}
      sourcegraph-token: ${SOURCEGRAPH_TOKEN}
      github-tokens:
        - ${GITHUB_TOKEN_1}
        - ${GITHUB_TOKEN_2}

  infrastructure:
    cloudflare:
      account-id: ${CF_ACCOUNT_ID}
      api-token: ${CF_API_TOKEN}
    webhooks:
      spring-url: ${SPRING_WEBHOOK_URL}
      discord-url: ${DISCORD_WEBHOOK_URL}

  admin:
    allowlist: ${ADMIN_ALLOWLIST_EMAILS}

custom:
  jwt:
    secret-key: ${CUSTOM_JWT_SECRET_KEY:start-ai-hub-default-secret-key-start-ai-hub-default}
    access-token-expiration-seconds: ${CUSTOM_JWT_ACCESS_EXPIRATION_SECONDS:172800}
    refresh-token-expiration-seconds: ${CUSTOM_JWT_REFRESH_EXPIRATION_SECONDS:604800}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      token-info-base-url: ${GOOGLE_TOKEN_INFO_BASE_URL:https://oauth2.googleapis.com}
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:5173
      - https://han-minhee.site
      - https://www.han-minhee.site
      - https://nbe-8-10-final-team04-front.vercel.app
      - https://www.nbe-8-10-final-team04-front.vercel.app
  swagger:
    enabled: false

logging:
  level:
    back: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

oci:
  user: ${OCI_USER}
  fingerprint: ${OCI_FINGERPRINT}
  tenancy: ${OCI_TENANCY}
  private-key: ${OCI_KEY}
  namespace: ${OCI_NAMESPACE}
  bucket: ${OCI_BUCKET}
  prefix: data/ai-info/
  auth-type: ${OCI_AUTH_TYPE:config-file}
  config-file-path: ${OCI_CONFIG_FILE_PATH:~/.oci/config}
  profile: ${OCI_CONFIG_PROFILE:DEFAULT}
  region: ${OCI_REGION:ap-chuncheon-1}

gemini:
  api-key: ${CRAWL_GEMINI_API_KEY}
  model: gemini-3.1-flash-lite-preview              # 매칭용 gemini-2.5-flash limit으로 인해 변경
  description-model: gemini-3.1-flash-lite-preview  # description 생성용

ai-model:
  webhook-secret: ${SPRING_WEBHOOK_SECRET}
  target-vendors:
    - openai
    - anthropic
    - google

github:
  owner-repo: ${GH_OWNER_REPO:prgrms-be-devcourse/NBE8-10-final-Team04}
  workflows:
    token: ${GITHUB_WORKFLOW_TOKEN}
    ai-info-and-stats:
      crons:
        - ${CRON_AI_INFO_AND_STATS:0 0 15 * * *}      # 매일 KST 00:00 (UTC 15:00)
    contents:
      crons:
        - ${CRON_CONTENTS_0:0 0 15 * * 1-5}            # 화~토 KST 00:00
        - ${CRON_CONTENTS_1:0 0 21 * * 1-5}            # 화~토 KST 06:00
        - ${CRON_CONTENTS_2:0 0 3 * * 2-6}             # 화~토 KST 12:00
        - ${CRON_CONTENTS_3:0 0 9 * * 2-6}             # 화~토 KST 18:00
    enrich:
      crons:
        - ${CRON_ENRICH_0:0 0 15 * * 0}                # 월 KST 00:00 (is_monday_midnight=true)
        - ${CRON_ENRICH_1:0 0 21 * * 0}                # 월 KST 06:00
        - ${CRON_ENRICH_2:0 0 3 * * 1}                 # 월 KST 12:00
        - ${CRON_ENRICH_3:0 0 9 * * 1}                 # 월 KST 18:00
    tracker-update:
      crons:
        - ${CRON_TRACKER_UPDATE:0 0 3 * * *}           # 매일 KST 12:00 (UTC 03:00)