server:
  forward-headers-strategy: native

spring:
  application:
    name: start-ai-hub
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 5MB

app:
  mcp:
    recommendation:
      candidate-source: ${APP_MCP_RECOMMENDATION_CANDIDATE_SOURCE:mock}
  storage:
    type: ${APP_STORAGE_TYPE:oci}

custom:
  jwt:
    secret-key: ${CUSTOM_JWT_SECRET_KEY:start-ai-hub-default-secret-key-start-ai-hub-default}
    access-token-expiration-seconds: ${CUSTOM_JWT_ACCESS_EXPIRATION_SECONDS:1800}
    refresh-token-expiration-seconds: ${CUSTOM_JWT_REFRESH_EXPIRATION_SECONDS:1209600}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      token-info-base-url: ${GOOGLE_TOKEN_INFO_BASE_URL:https://oauth2.googleapis.com}
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
  swagger:
    enabled: false

logging:
  level:
    back: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

oci:
  namespace: ${OCI_NAMESPACE}
  bucket: ${OCI_BUCKET}
  prefix: data/ai-info/
  auth-type: ${OCI_AUTH_TYPE:config-file}
  config-file-path: ${OCI_CONFIG_FILE_PATH:~/.oci/config}
  profile: ${OCI_CONFIG_PROFILE:DEFAULT}
  region: ${OCI_REGION:}

gemini:
  api-key: ${CRAWL_GEMINI_API_KEY}
  model: gemini-3.1-flash-lite-preview              # 매칭용 gemini-2.5-flash limit으로 변경
  description-model: gemini-3.1-flash-lite-preview  # description 생성용

ai-model:
  webhook-secret: ${SPRING_WEBHOOK_SECRET}
  target-vendors:
    - openai
    - anthropic
    - google