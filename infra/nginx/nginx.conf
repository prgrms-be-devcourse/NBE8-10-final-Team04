# api.han-minhee.site → Spring Boot
server {
    listen 443 ssl;
    server_name api.han-minhee.site;

    ssl_certificate     /etc/letsencrypt/live/han-minhee.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/han-minhee.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # MCP Gateway (path-based)
    location = /mcp {
        proxy_pass http://127.0.0.1:9000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:9000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# monitoring.han-minhee.site → Grafana
server {
    listen 443 ssl;
    server_name monitoring.han-minhee.site;

    ssl_certificate     /etc/letsencrypt/live/han-minhee.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/han-minhee.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 팀원 IP만 허용
    # allow 팀원IP/32;
    # deny all;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.han-minhee.site monitoring.han-minhee.site;
    return 301 https://$host$request_uri;
}
